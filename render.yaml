services:
  - type: web
    name: medicalproject-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://aasthapolyclinic.com,https://www.aasthapolyclinic.com,https://frontend-zeta-dusky-94.vercel.app
      - key: DATABASE_URL
        sync: false

